name: Build and Release Photo Deduplicator GUI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 配置 .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 编译发布原生单文件 EXE
      run: |
        dotnet publish PhotoDeduplicatorGUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

    - name: 确定发布版本号 (Tag)
      id: tag_version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "TAG_NAME=v2.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
        fi

    - name: 自动发布到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag_version.outputs.TAG_NAME }}
        name: "PhotoDeduplicator GUI ${{ steps.tag_version.outputs.TAG_NAME }}"
        body: |
          ### 🎉 Windows 全文件与照片深度去重归档工具 V2.0 (模块化重构版)

          #### 🚀 软件下载
          请在下方 **Assets** 区域直接下载 **`PhotoDeduplicatorGUI.exe`**，双击即可运行，绿色单文件！

          #### ✨ V2.0 核心升级
          - **工程化分层架构**：拆分为 `Models` / `Services` / `UI` 模块，高内聚低耦合，便于后续持续扩展。
          - **SHA-256 分块快速哈希复核**：即使照片在拷贝时被**重命名**，只要内容 100% 一致即可精准识别并自动去重；同时防止“同名同大小但内容不同”的误删风险。
          - **审查窗口闭环与快捷键**：支持 3 个以上多版本擂台式对比；点击保留胜出文件后**自动按拍摄年月移入 `整理归档/`**；支持 `1`/`2`/`空格`/方向键盲操。
        draft: false
        prerelease: false
        files: |
          dist/PhotoDeduplicatorGUI.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
